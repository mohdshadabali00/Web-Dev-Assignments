<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Structure</title>
</head>
<body>
  <header>
    <nav>
      <a href="#about">About</a> |
      <a href="#projects">Projects</a> |
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main>
    <section id="about">
      <h1>Hi, I'm Shadab</h1>
      <p>Aspiring AI/ML Engineer & Web Developer.</p>
    </section>
    <section id="projects">
      <h2>Projects</h2>
      <article>
        <h3>Portfolio Website</h3>
        <p>Built using semantic HTML5.</p>
      </article>
    </section>
    <section id="contact">
      <h2>Contact Me</h2>
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <footer><p>Built by Shadab</p></footer>
</body>
</html>
